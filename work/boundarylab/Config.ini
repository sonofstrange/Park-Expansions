-- Park Expansions 0.51
-- This file uses Lua syntax: true/false, numbers, and -- comments.
-- Reload the park after changing these settings.

-- true: use the five Park Size and Height research upgrades.
-- false: apply ManualParkSize and ManualMaxHeight automatically, without points.
-- This switch is independent of the game's sandbox research setting.
ResearchEnabled = true

-- Maximum terrain size for new sandbox parks: 2048 or 4096.
-- false (or 2048): standard 2048 x 2048 m map (default, lower resource consumption and faster load times).
-- true (or 4096): experimental 4096 x 4096 m map.
-- WARNING: 4096 x 4096 maps take significantly longer to load and use substantially more system resources (RAM, VRAM, and CPU)!
-- Existing saves retain their original map size.
Enable4KMap = false

-- Used only when ResearchEnabled = false.
-- Requested buildable square side, in metres. No configured upper cap.
-- Values above 2048 may be unstable.
-- For 2048 m terrain, buildable size is 2040 m; for 4096 m terrain, buildable size is 4088 m.
-- Existing 2048 m parks keep their original terrain size.
-- A requested boundary outside the loaded terrain is reported as a failed
-- application, rather than silently clamped. This setting does not add terrain.
ManualParkSize = 2040

-- Used only when ResearchEnabled = false.
-- Absolute ceiling in WORLD Y metres (not height above local terrain).
-- No configured upper cap. Values above 2048 may be unstable.
-- Ride-specific and engine limits may still apply.
ManualMaxHeight = 2048

-- Manual limits apply to supported new sandboxes and existing managed parks.
-- Smaller sizes move the boundary inward; existing objects are not deleted.
-- Saved research unlocks are retained when switching modes.

-- Multiplier for maximum camera zoom-out distance (e.g. 2.0 allows zooming out 2x further).
-- Default is 2.0 (maximum zoom distance 600 m instead of stock 300 m).
CameraZoomMultiplier = 2.0
